services:
  app:
    build: .
    container_name: leveling-zone-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      IPDB_AUTO_INSTALL: '1'
      IPDB_REPO: lucking7/leveling.zone
    volumes:
      - ./data/db:/app/data/db
    networks:
      - caddy-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: leveling-zone-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    networks:
      - caddy-net
    depends_on:
      app:
        condition: service_healthy
    environment:
      CADDY_ADMIN: 0.0.0.0:2019

  # Explicit opt-in updater: docker compose -f docker-compose.caddy.yml run --rm db-updater
  db-updater:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.ipdb
    command: ["install", "--repo", "lucking7/leveling.zone", "--store", "/data"]
    volumes:
      - ./data/db:/data
    restart: "no"

volumes:
  caddy_data:
  caddy_config:

networks:
  caddy-net:
    driver: bridge
