name: Update IP Databases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a verified Release (false downloads and validates only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ip-database-release
  cancel-in-progress: false

jobs:
  update-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-ipdb.txt
      - name: Install database tooling
        run: python -m pip install -r scripts/requirements-ipdb.txt
      - name: Test database transactions
        run: python -m unittest discover -s tests -p 'test_*ipdb*.py' -v
      - name: Select immutable version
        id: version
        run: echo "tag=ip-db-$(date -u +'%Y.%m.%d')-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Download and validate all selected databases
        env:
          IP2LOCATION_TOKEN: ${{ secrets.IP2LOCATION_TOKEN }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: python scripts/ipdb.py update --config config/databases.json --store data/db --version '${{ steps.version.outputs.tag }}'
      - name: Save validation manifest
        uses: actions/upload-artifact@v4
        with:
          name: database-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/db/current/manifest.json
            data/db/current/SHA256SUMS
          if-no-files-found: error
      - name: Verify and publish complete Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/publish-ipdb.py
          --directory data/db/current
          --repo "$GITHUB_REPOSITORY"
          --tag '${{ steps.version.outputs.tag }}'
          --target "$GITHUB_SHA"
